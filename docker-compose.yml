name: unum

services:
  # ─────────────────────────────────────────────────────────────
  # Banco de dados PostgreSQL 16
  # ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: unum-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unum_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-unum}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unum} -d ${POSTGRES_DB:-unum}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unum-net

  # ─────────────────────────────────────────────────────────────
  # Adminer — interface web para inspecionar o banco
  # Acesse: http://localhost:8080
  # ─────────────────────────────────────────────────────────────
  adminer:
    image: adminer:4-standalone
    container_name: unum-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unum-net

  # ─────────────────────────────────────────────────────────────
  # API FastAPI
  # Acesse: http://localhost:8000/docs
  # ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: unum-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-unum}:${POSTGRES_PASSWORD:-unum_dev_password}@db:5432/${POSTGRES_DB:-unum}
      JWT_SECRET: ${JWT_SECRET:-troque_em_producao_pelo_amor_de_deus}
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - api_models:/app/ml/models
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unum-net
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
  # ─────────────────────────────────────────────────────────────
  # Frontend Next.js
  # Acesse: http://localhost:3000
  # ─────────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: unum-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - unum-net
    command: npm run dev

volumes:
  db_data:
    name: unum_db_data
  api_models:
    name: unum_api_models

networks:
  unum-net:
    name: unum-net
    driver: bridge